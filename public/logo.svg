<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A853"/>
      <stop offset="30%" style="stop-color:#C9952E"/>
      <stop offset="50%" style="stop-color:#E8C86B"/>
      <stop offset="70%" style="stop-color:#C9952E"/>
      <stop offset="100%" style="stop-color:#D4A853"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C86B"/>
      <stop offset="50%" style="stop-color:#F0D98C"/>
      <stop offset="100%" style="stop-color:#E8C86B"/>
    </linearGradient>
  </defs>
  <!-- Mane outer -->
  <path d="M100 10 C60 10 25 35 25 80 C25 100 30 115 40 128 C28 135 20 148 20 165 C20 185 35 195 50 195 L150 195 C165 195 180 185 180 165 C180 148 172 135 160 128 C170 115 175 100 175 80 C175 35 140 10 100 10Z" fill="url(#gold)" stroke="url(#goldLight)" stroke-width="1.5"/>
  <!-- Face -->
  <ellipse cx="100" cy="105" rx="55" ry="62" fill="#1a1408"/>
  <!-- Inner mane detail -->
  <path d="M100 18 C65 18 35 40 35 80 C35 98 40 112 48 122 C55 115 70 112 100 112 C130 112 145 115 152 122 C160 112 165 98 165 80 C165 40 135 18 100 18Z" fill="url(#gold)" opacity="0.6"/>
  <!-- Face inner -->
  <ellipse cx="100" cy="100" rx="48" ry="52" fill="#0d0a04"/>
  <!-- Eyes -->
  <ellipse cx="78" cy="88" rx="8" ry="6" fill="url(#gold)"/>
  <ellipse cx="122" cy="88" rx="8" ry="6" fill="url(#gold)"/>
  <ellipse cx="78" cy="88" rx="3" ry="4" fill="#0d0a04"/>
  <ellipse cx="122" cy="88" rx="3" ry="4" fill="#0d0a04"/>
  <!-- Eye shine -->
  <circle cx="80" cy="86" r="1.5" fill="#F0D98C" opacity="0.8"/>
  <circle cx="124" cy="86" r="1.5" fill="#F0D98C" opacity="0.8"/>
  <!-- Nose -->
  <path d="M95 102 L100 98 L105 102 L103 106 Q100 109 97 106Z" fill="url(#gold)"/>
  <!-- Mouth -->
  <path d="M90 112 Q95 108 100 110 Q105 108 110 112" stroke="url(#gold)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Whisker dots -->
  <circle cx="75" cy="105" r="1" fill="url(#goldLight)" opacity="0.5"/>
  <circle cx="70" cy="108" r="1" fill="url(#goldLight)" opacity="0.5"/>
  <circle cx="68" cy="102" r="1" fill="url(#goldLight)" opacity="0.5"/>
  <circle cx="125" cy="105" r="1" fill="url(#goldLight)" opacity="0.5"/>
  <circle cx="130" cy="108" r="1" fill="url(#goldLight)" opacity="0.5"/>
  <circle cx="132" cy="102" r="1" fill="url(#goldLight)" opacity="0.5"/>
  <!-- Ears -->
  <path d="M45 55 L55 30 L70 55Z" fill="url(#gold)"/>
  <path d="M155 55 L145 30 L130 55Z" fill="url(#gold)"/>
  <path d="M50 52 L58 35 L66 52Z" fill="#1a1408"/>
  <path d="M150 52 L142 35 L134 52Z" fill="#1a1408"/>
  <!-- Crown/mane tufts -->
  <path d="M70 20 Q80 5 90 18" stroke="url(#gold)" stroke-width="2" fill="none"/>
  <path d="M88 15 Q100 2 112 15" stroke="url(#gold)" stroke-width="2" fill="none"/>
  <path d="M110 18 Q120 5 130 20" stroke="url(#gold)" stroke-width="2" fill="none"/>
  <!-- Chin/jaw -->
  <path d="M65 140 Q100 165 135 140" stroke="url(#gold)" stroke-width="2" fill="none"/>
  <!-- Text: BIG DADDY -->
  <text x="100" y="200" text-anchor="middle" font-family="serif" font-weight="700" font-size="22" letter-spacing="6" fill="url(#gold)">BIG DADDY</text>
  <!-- Decorative line -->
  <line x1="40" y1="210" x2="160" y2="210" stroke="url(#gold)" stroke-width="0.8" opacity="0.6"/>
  <!-- Tagline -->
  <text x="100" y="225" text-anchor="middle" font-family="sans-serif" font-weight="400" font-size="7" letter-spacing="4" fill="url(#goldLight)" opacity="0.8">PREMIUM COLLECTIONS</text>
</svg>
